<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parivar Admin Panel</title>
    <!-- Dynamic Favicon link tag -->
    <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Google Fonts Noto Sans (English, Gujarati, Hindi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Google Translate API Initialization -->
    <div id="google_translate_element" style="display: none;"></div>
    <script>
      (function() {
        var lang = localStorage.getItem('app-language') || 'en';
        if (lang && lang !== 'en') {
          document.cookie = 'googtrans=/en/' + lang + '; path=/;';
          var domain = window.location.hostname;
          if (domain !== 'localhost' && !/^(\d{1,3}\.){3}\d{1,3}$/.test(domain)) {
            document.cookie = 'googtrans=/en/' + lang + '; domain=.' + domain + '; path=/;';
          }
        }
      })();

      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          try {
            new window.google.translate.TranslateElement(
              {
                pageLanguage: 'en',
                includedLanguages: 'en,gu,hi',
                autoDisplay: false
              },
              'google_translate_element'
            );
            
            var storedLang = localStorage.getItem('app-language');
            if (storedLang && storedLang !== 'en') {
              setTimeout(function() {
                var select = document.querySelector('.goog-te-combo');
                if (select && select.value !== storedLang) {
                  select.value = storedLang;
                  select.dispatchEvent(new Event('change'));
                }
              }, 150);
            }
          } catch (e) {
            console.warn('Google Translate Init Warning:', e);
          }
        }
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <style>
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner,
      .skiptranslate.goog-te-banner-frame,
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      iframe[id=":1.container"],
      iframe[id=":2.container"],
      #goog-gt-tt,
      #goog-gt-vt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-te-spinner-pos,
      .goog-te-spinner,
      .goog-te-gadget-icon,
      .goog-te-gadget,
      .goog-te-gadget-simple,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc,
      .VIpgJd-ZVi9od-xl07Ob-lTBxed,
      .VIpgJd-ZVi9od-vH1Gmf,
      #google_translate_element,
      #google_translate_hidden_element {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
